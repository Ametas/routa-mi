name: Mihomo Core Update

# Watches official MetaCubeX/mihomo stable releases. When the bundled core is
# behind, it moves core/Clash.Meta to the new tag on a bot branch, applies
# core/patches/mihomo/*.patch, runs the full test suite and a debug APK build,
# and opens a pull request into main (a draft one when validation fails, so
# the patch/fixtures can be fixed on that branch). It never pushes to main.
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so the bot
# branch would get no ci.yml checks and could not pass branch protection.
# The branch is therefore pushed and the PR opened with, in order of
# preference: a GitHub App token (vars.CORE_UPDATE_APP_ID +
# secrets.CORE_UPDATE_APP_PRIVATE_KEY), a fine-grained PAT
# (secrets.CORE_UPDATE_TOKEN), or GITHUB_TOKEN as a fallback. See docs/CI.md.
#
# The `case "$REL" in` block below is parsed by
# scripts/test_mihomo_core_relationship_contract.sh; keep its arm layout.
on:
  schedule:
    - cron: "20 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only: no push, no pull request"
        required: false
        default: false
        type: boolean

concurrency:
  group: mihomo-core-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-core:
    name: Check MetaCubeX release and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Mint GitHub App token
        id: app-token
        if: vars.CORE_UPDATE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CORE_UPDATE_APP_ID }}
          private-key: ${{ secrets.CORE_UPDATE_APP_PRIVATE_KEY }}

      - name: Report push token
        id: token
        env:
          HAS_APP: ${{ steps.app-token.outputs.token != '' }}
          HAS_PAT: ${{ secrets.CORE_UPDATE_TOKEN != '' }}
        run: |
          if [ "$HAS_APP" = "true" ]; then
            echo "source=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "source=pat" >> "$GITHUB_OUTPUT"
          else
            echo "source=github_token" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither a GitHub App nor CORE_UPDATE_TOKEN is configured; the bot PR will get no CI checks (see docs/CI.md)."
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
          # Persisted for the branch push below.
          token: ${{ steps.app-token.outputs.token || secrets.CORE_UPDATE_TOKEN || github.token }}

      - name: Verify updater relationship contract
        run: bash scripts/test_mihomo_core_relationship_contract.sh

      - name: Resolve core relationship
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Decided by commit ancestry, never by dates or tag strings.
          bash scripts/mihomo-core-relationship.sh core/Clash.Meta > "$RUNNER_TEMP/rel.txt"
          cat "$RUNNER_TEMP/rel.txt"
          cat "$RUNNER_TEMP/rel.txt" >> "$GITHUB_OUTPUT"

      - name: Decide update action
        id: decision
        env:
          REL: ${{ steps.rel.outputs.relationship_to_stable }}
        run: |
          set -euo pipefail
          case "$REL" in
            DIVERGED)
              echo "action=fail_closed" >> "$GITHUB_OUTPUT"
              ;;
            BEHIND_STABLE)
              echo "action=upgrade_stable" >> "$GITHUB_OUTPUT"
              ;;
            EXACT_STABLE|AHEAD_OF_STABLE)
              echo "action=noop" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown relationship: $REL" >&2
              exit 1
              ;;
          esac

      - name: Fail closed on diverged history
        if: steps.decision.outputs.action == 'fail_closed'
        run: |
          echo "::error::core/Clash.Meta has diverged from the latest MetaCubeX stable release. Nothing was changed; manual review required."
          exit 1

      - name: Set up toolchain
        if: steps.decision.outputs.action == 'upgrade_stable'
        uses: ./.github/actions/setup-toolchain

      - name: Move submodule to the new release
        if: steps.decision.outputs.action == 'upgrade_stable'
        id: update
        env:
          TAG: ${{ steps.rel.outputs.latest_stable_tag }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          BRANCH="bot/mihomo-core-$TAG"
          if [ -n "$APP_SLUG" ]; then
            BOT_ID="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git switch -c "$BRANCH"

          git -C core/Clash.Meta checkout -q "refs/tags/$TAG"
          (cd core && go mod tidy)
          git add core/Clash.Meta core/go.mod core/go.sum
          git commit -m "chore(core): update mihomo to $TAG"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "new_sha=$(git -C core/Clash.Meta rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate (patches, tests, debug APK)
        if: steps.decision.outputs.action == 'upgrade_stable'
        id: validate
        continue-on-error: true
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/validate.log"
          {
            echo "## flutter pub get"; flutter pub get
            echo "## patch-mihomo"; bash plugins/setup/buildkit/run_build_tool.sh patch-mihomo
            echo "## flutter analyze"; flutter analyze --no-fatal-infos
            echo "## flutter test"; flutter test --reporter=compact
            echo "## go mod tidy check"; (cd core && go mod tidy && git diff --exit-code go.mod go.sum)
            echo "## go test (core)"; (cd core && CGO_ENABLED=0 go test -tags=with_gvisor,cmfa ./...)
            echo "## go test (mihomo statistic)"; (cd core/Clash.Meta && go test ./tunnel/statistic)
            echo "## debug APK"
            bash plugins/setup/buildkit/run_build_tool.sh android --arch arm64
            flutter build apk --debug --target-platform android-arm64 \
              --android-project-arg=slclashSkipGoCoreBuild=true
          } 2>&1 | tee "$LOG"

      - name: Build review report
        if: steps.decision.outputs.action == 'upgrade_stable'
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ steps.rel.outputs.current_sha }}
          CURRENT_TAG: ${{ steps.rel.outputs.nearest_release_tag }}
          NEW_SHA: ${{ steps.update.outputs.new_sha }}
          TAG: ${{ steps.rel.outputs.latest_stable_tag }}
          OUTCOME: ${{ steps.validate.outcome }}
          TOKEN_SOURCE: ${{ steps.token.outputs.source }}
        run: |
          set -euo pipefail
          M="git -C core/Clash.Meta"
          COMMIT_COUNT="$($M rev-list --count "$CURRENT_SHA..$NEW_SHA")"
          COMMITS="$($M log --no-merges --format='- `%h` %s' "$CURRENT_SHA..$NEW_SHA" | head -n 80)"
          # Files our patches touch, and whether upstream changed them.
          mapfile -t PATCHED_FILES < <(grep -h '^+++ b/' core/patches/mihomo/*.patch | sed 's#^+++ b/##' | sort -u)
          PATCHED_CHANGED="$($M diff --name-only "$CURRENT_SHA" "$NEW_SHA" -- "${PATCHED_FILES[@]}" || true)"
          CONFIG_CHANGED="$($M diff --name-only "$CURRENT_SHA" "$NEW_SHA" -- config/ | head -n 40)"
          RELEASE_BODY="$(gh api "repos/MetaCubeX/mihomo/releases/tags/$TAG" --jq '.body // ""' 2>/dev/null | head -n 60 || true)"

          REPORT="$RUNNER_TEMP/report.md"
          {
            echo "## Обновление ядра mihomo: $CURRENT_TAG → $TAG"
            echo ""
            echo "- Было: \`$CURRENT_SHA\` ($CURRENT_TAG)"
            echo "- Стало: \`$NEW_SHA\` ($TAG), официальный релиз MetaCubeX/mihomo"
            echo "- Коммитов апстрима: $COMMIT_COUNT"
            if [ "$OUTCOME" = "success" ]; then
              echo "- Проверка: ✅ патчи наложились, flutter analyze/test, go test и debug APK — успешно"
            else
              echo "- Проверка: ❌ **не пройдена** — PR открыт как draft, исправьте патч/фикстуры в этой ветке"
            fi
            echo ""
            echo "### Файлы наших патчей, изменённые апстримом"
            if [ -n "$PATCHED_CHANGED" ]; then printf '%s\n' "$PATCHED_CHANGED" | sed 's/^/- `/; s/$/`/'; else echo "нет"; fi
            echo ""
            echo "### Изменения в config/ (контракт RawConfig)"
            if [ -n "$CONFIG_CHANGED" ]; then printf '%s\n' "$CONFIG_CHANGED" | sed 's/^/- `/; s/$/`/'; else echo "нет"; fi
            echo ""
            if [ "$OUTCOME" != "success" ]; then
              echo "### Хвост лога проверки"
              echo '```'
              tail -n 60 "$RUNNER_TEMP/validate.log" 2>/dev/null || echo "(лог недоступен)"
              echo '```'
              echo ""
            fi
            echo "<details><summary>Коммиты апстрима</summary>"
            echo ""
            printf '%s\n' "$COMMITS"
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>Release notes $TAG</summary>"
            echo ""
            printf '%s\n' "$RELEASE_BODY"
            echo ""
            echo "</details>"
            echo ""
            echo "Перед мёрджем: обновить UPSTREAM.md (раздел «Ядро»)."
            if [ "$TOKEN_SOURCE" = "github_token" ]; then
              echo ""
              echo "⚠ PR открыт через GITHUB_TOKEN: ci.yml на эту ветку не запустится, обязательные проверки не появятся. Настройте токен по docs/CI.md или запустите CI вручную (Actions → CI → Run workflow)."
            fi
          } > "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo "file=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Push branch and open pull request
        if: steps.decision.outputs.action == 'upgrade_stable' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CORE_UPDATE_TOKEN || github.token }}
          BRANCH: ${{ steps.update.outputs.branch }}
          TAG: ${{ steps.rel.outputs.latest_stable_tag }}
          OUTCOME: ${{ steps.validate.outcome }}
          REPORT: ${{ steps.report.outputs.file }}
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          TITLE="chore(core): update mihomo to $TAG"
          [ "$OUTCOME" = "success" ] || TITLE="$TITLE (validation failed)"
          EXISTING="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$REPORT"
          else
            DRAFT=()
            [ "$OUTCOME" = "success" ] || DRAFT=(--draft)
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$REPORT" "${DRAFT[@]}"
          fi

      - name: Fail on validation failure
        if: steps.decision.outputs.action == 'upgrade_stable' && steps.validate.outcome != 'success'
        run: |
          echo "::error::Validation of mihomo ${{ steps.rel.outputs.latest_stable_tag }} failed; see the report above."
          exit 1

      - name: Summary
        if: always()
        env:
          REL: ${{ steps.rel.outputs.relationship_to_stable }}
          ACTION: ${{ steps.decision.outputs.action }}
        run: |
          {
            echo "## Mihomo core update"
            echo "- Current: ${{ steps.rel.outputs.current_sha }} (${{ steps.rel.outputs.nearest_release_tag }})"
            echo "- Latest stable: ${{ steps.rel.outputs.latest_stable_tag }} (${{ steps.rel.outputs.latest_stable_sha }})"
            echo "- Relationship: $REL → action: $ACTION"
            echo "- Push token: ${{ steps.token.outputs.source }}"
          } >> "$GITHUB_STEP_SUMMARY"
