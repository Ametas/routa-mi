name: Release

# Signed release APK + GitHub Release for vX.Y.Z (or vX.Y.Z-suffix, published
# as a prerelease). Two ways to start it (see docs/RELEASE.md):
#   - push a tag v* that points at a commit on main;
#   - Actions → Release → Run workflow on main with a new tag name: the tag
#     is created on that main commit only after the APK is built and
#     verified, so a failed run leaves nothing behind.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "New tag to release from main, e.g. v0.1.0 or v0.1.0-rc.1"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate tag and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      sha: ${{ steps.vars.outputs.sha }}
      create_tag: ${{ steps.vars.outputs.create_tag }}
      version_name: ${{ steps.vars.outputs.version_name }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      apk_name: ${{ steps.vars.outputs.apk_name }}
      notes_file: ${{ steps.vars.outputs.notes_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: vars
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            CREATE_TAG=true
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run this workflow on main (got $GITHUB_REF)"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists"
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
            CREATE_TAG=false
          fi
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-rc.1, got '$TAG'"
            exit 1
          fi
          PRERELEASE=false
          [ -n "${BASH_REMATCH[2]}" ] && PRERELEASE=true
          # User-facing changes; the in-app update dialog shows its bullets.
          NOTES_FILE="docs/releases/v${BASH_REMATCH[1]}.md"
          if [ "$PRERELEASE" = "false" ] && [ ! -f "$NOTES_FILE" ]; then
            echo "::error::$NOTES_FILE is missing (see docs/RELEASE.md)"
            exit 1
          fi
          # Only release commits that are already on main.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG ($GITHUB_SHA) is not on main"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "sha=$GITHUB_SHA"
            echo "create_tag=$CREATE_TAG"
            echo "version_name=${TAG#v}"
            echo "prerelease=$PRERELEASE"
            echo "apk_name=RoutaMi-${TAG}-arm64-v8a.apk"
            echo "notes_file=$NOTES_FILE"
          } >> "$GITHUB_OUTPUT"

      # Fail in seconds instead of after the CI gate when signing is not set up.
      - name: Check signing secrets
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          missing=()
          [ "$HAS_KEYSTORE" = "true" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ "$HAS_STORE_PASSWORD" = "true" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ "$HAS_KEY_ALIAS" = "true" ] || missing+=(ANDROID_KEY_ALIAS)
          [ "$HAS_KEY_PASSWORD" = "true" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Signing secrets are not set: ${missing[*]} (see docs/RELEASE.md)"
            exit 1
          fi

  ci:
    name: CI gate
    needs: prepare
    uses: ./.github/workflows/ci.yml
    # The gate's debug APK uses ANDROID_DEBUG_KEYSTORE_BASE64 like any CI run.
    secrets: inherit

  release:
    name: Signed release APK
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Resolve version
        id: vars
        run: |
          set -euo pipefail
          {
            echo "tag=${{ needs.prepare.outputs.tag }}"
            echo "version_name=${{ needs.prepare.outputs.version_name }}"
            # Monotonic across releases; fits Android's versionCode limit
            # (2100000000) until 2036.
            echo "build_number=$(date -u +%s)"
            echo "prerelease=${{ needs.prepare.outputs.prerelease }}"
            echo "apk_name=${{ needs.prepare.outputs.apk_name }}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Prepare signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (see docs/RELEASE.md)"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          # android/app/build.gradle.kts reads these keys; without all of
          # them it silently falls back to debug signing, which the verify
          # step below rejects.
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/local.properties
          keytool -list -keystore android/app/keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Install dependencies
        run: flutter pub get

      # Release builds always compile the core from source (no cache) so the
      # shipped libclash.so is traceable to this commit.
      - name: Build Go core
        id: core
        uses: ./.github/actions/build-go-core
        with:
          use-cache: "false"

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --android-project-arg=slclashSkipAbiFilters=true \
            --android-project-arg=slclashSkipGoCoreBuild=true \
            --build-name "${{ steps.vars.outputs.version_name }}" \
            --build-number "${{ steps.vars.outputs.build_number }}" \
            --dart-define=APP_ENV=stable \
            ${{ steps.core.outputs.dart-defines }}

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          SRC="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APK="dist/${{ steps.vars.outputs.apk_name }}"
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected APK not found: $SRC"
            find build/app/outputs -type f || true
            exit 1
          fi
          mkdir -p dist
          cp "$SRC" "$APK"

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          PACKAGE="$("$BUILD_TOOLS/aapt2" dump packagename "$APK")"
          echo "packageName: $PACKAGE"
          if [ "$PACKAGE" != "icu.routaterm.routami" ]; then
            echo "::error::Unexpected packageName $PACKAGE (debug-signing fallback?)"
            exit 1
          fi

          CERTS="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          if grep -q "CN=Android Debug" <<<"$CERTS"; then
            echo "::error::APK is signed with the debug key"
            exit 1
          fi
          CERT_SHA256="$(grep -m1 'certificate SHA-256 digest' <<<"$CERTS" | awk '{print $NF}')"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$(basename "$APK")" > "$APK.sha256"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "### APK"
            echo "- \`$(basename "$APK")\` SHA-256: \`$APK_SHA256\`"
            echo "- Signing certificate SHA-256: \`$CERT_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f android/app/keystore.jks android/local.properties

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.apk_name }}
          path: |
            dist/${{ steps.vars.outputs.apk_name }}
            dist/${{ steps.vars.outputs.apk_name }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          CREATE_TAG: ${{ needs.prepare.outputs.create_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite"
            exit 1
          fi
          if [ "$CREATE_TAG" = "true" ]; then
            # Manual run: tag the built commit now. A push made with
            # GITHUB_TOKEN does not re-trigger this workflow.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "RoutaMi $TAG" "${{ needs.prepare.outputs.sha }}"
            git push origin "refs/tags/$TAG"
          fi
          NOTES="$RUNNER_TEMP/notes.md"
          CHANGES="${{ needs.prepare.outputs.notes_file }}"
          # Only the change list may use "- " bullets: the in-app update
          # dialog shows every bullet of the body, so build info is a table.
          {
            if [ -f "$CHANGES" ]; then cat "$CHANGES"; echo; fi
            cat <<EOF
          RoutaMi ${{ steps.vars.outputs.version_name }} — Android arm64-v8a.

          | Build | |
          |---|---|
          | Mihomo core | ${{ steps.core.outputs.mihomo-version }} (${{ steps.core.outputs.mihomo-commit }}), released ${{ steps.core.outputs.mihomo-release-date }} |
          | libclash.so SHA-256 | \`${{ steps.core.outputs.core-sha256 }}\` |
          | APK SHA-256 | \`${{ steps.verify.outputs.apk_sha256 }}\` |
          | Signing certificate SHA-256 | \`${{ steps.verify.outputs.cert_sha256 }}\` |
          EOF
          } > "$NOTES"
          PRERELEASE_FLAG=()
          [ "${{ steps.vars.outputs.prerelease }}" = "true" ] && PRERELEASE_FLAG=(--prerelease)
          gh release create "$TAG" \
            "dist/${{ steps.vars.outputs.apk_name }}" \
            "dist/${{ steps.vars.outputs.apk_name }}.sha256" \
            --verify-tag \
            --title "RoutaMi ${{ steps.vars.outputs.version_name }}" \
            --notes-file "$NOTES" \
            "${PRERELEASE_FLAG[@]}"
